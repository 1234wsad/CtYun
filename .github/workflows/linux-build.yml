name: Build Linux Executable

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Read version
      id: version
      run: |
        version=$(grep -oP '(?<=<FileVersion>).*?(?=</FileVersion>)' CtYun/CtYun.csproj)
        echo "version=$version" >> $GITHUB_ENV
        echo "Building version: $version"

    - name: Publish Linux x64
      run: |
        dotnet publish CtYun/CtYun.csproj \
          -c Release \
          -r linux-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:EnableCompressionInSingleFile=true \
          -o ./publish/linux-x64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ctyun-linux-x64-${{ env.version }}
        path: ./publish/linux-x64/CtYun
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/linux-x64/CtYun
        body: "Linux x64 自包含可执行文件"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
